[project]
name = "aider"
version = "0.1.0"
description = "Digital Equity Analyst - autonomous equity research pipeline"
authors = ["Aider Team <dev@example.com>"]
dependencies = [
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "alembic>=1.13",
  "boto3>=1.34",
  "structlog>=24.0",
  "fredapi>=0.5",
  "yfinance>=0.2.36",
  "pandas>=2.1",
  "apscheduler>=3.10",
]

[tool.poetry.dev-dependencies]
pytest = "*"
responses = "*"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
