services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst
      POSTGRES_DB: analyst_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d analyst_db || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Core services built from the repo image
  scanner:
    build: .
    env_file: .env
    depends_on:
      - redis
      - postgres

  rs1:
    build: .
    env_file: .env
    depends_on:
      - redis
      - postgres

  rs2:
    build: .
    env_file: .env
    depends_on:
      - redis
      - postgres

  rs3:
    build: .
    env_file: .env
    depends_on:
      - redis
      - postgres

  av1:
    build: .
    env_file: .env
    depends_on:
      - redis
      - postgres

  av2:
    build: .
    env_file: .env
    depends_on:
      - redis
      - postgres

  av3:
    build: .
    env_file: .env
    depends_on:
      - redis
      - postgres

  pm1:
    build: .
    env_file: .env
    depends_on:
      - redis
      - postgres

  quant_critic:
    build: .
    env_file: .env
    depends_on:
      - redis
      - postgres

  logic_critic:
    build: .
    env_file: .env
    depends_on:
      - redis
      - postgres

  data_critic:
    build: .
    env_file: .env
    depends_on:
      - redis
      - postgres

  arbiter:
    build: .
    env_file: .env
    depends_on:
      - redis
      - postgres

  pm2:
    build: .
    env_file: .env
    depends_on:
      - redis
      - postgres

  pm3:
    build: .
    env_file: .env
    depends_on:
      - redis
      - postgres

  monitor:
    build: .
    env_file: .env
    depends_on:
      - redis
      - postgres

  orchestrator-monitor:
    build: .
    env_file: .env
    command: python -m orchestrator.entrypoint --poll-interval 30 --base-delay 60 --max-attempts 3
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  health:
    build: .
    env_file: .env
    command: uvicorn monitor.health:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - postgres

volumes:
  minio_data:

