name: CI Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install -e "[dev]"; fi

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          ENV: development
          ANTHROPIC_API_KEY: dummy
          REDIS_URL: sqlite:///noop
        run: |
          pytest -q tests/unit --maxfail=1

  integration-tests:
    name: Integration Tests (Postgres + Redis)
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: analyst
          POSTGRES_PASSWORD: analyst
          POSTGRES_DB: analyst_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U analyst -d analyst_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install -e "[dev]"; fi

      - name: Wait for PostgreSQL
        run: |
          python - <<'PY'
          import time

          import psycopg2
          import redis

          deadline = time.time() + 60
          dsn = "host=localhost port=5432 dbname=analyst_db user=analyst password=analyst"
          redis_client = redis.Redis(host="localhost", port=6379, decode_responses=True)
          last_error = None
          while time.time() < deadline:
              try:
                  with psycopg2.connect(dsn) as conn:
                      with conn.cursor() as cur:
                          cur.execute('SELECT 1')
                redis_client.ping()
                print('PostgreSQL and Redis are ready')
                raise SystemExit(0)
              except Exception as exc:  # noqa: BLE001
                  last_error = exc
                  time.sleep(2)
          raise SystemExit(f'Timed out waiting for PostgreSQL/Redis: {last_error}')
          PY

      - name: Run integration tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          TEST_DB_URL: postgresql://analyst:analyst@localhost:5432/analyst_db
          AIDER_DATABASE_URL: postgresql://analyst:analyst@localhost:5432/analyst_db
          ENV: development
          ANTHROPIC_API_KEY: dummy
          REDIS_URL: redis://localhost:6379
        run: |
          pytest -q tests/integration --maxfail=1
